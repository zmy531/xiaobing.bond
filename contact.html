<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系作者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
	--accent:#7c3aed;--accent2:#3b82f6;--accent3:#f472b6;
	--text:#1e293b;--text-dim:#64748b;
	--glass:rgba(255,255,255,0.7);
	--glass-br:rgba(255,255,255,0.8);
	--bg:rgba(245,243,255,0.85);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#f5f3ff 0%,#ede9fe 30%,#dbeafe 60%,#fce7f3 100%);min-height:100vh;overflow-x:hidden}
.bg-orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.3;animation:orbFloat 18s infinite ease-in-out}
.orb1{width:300px;height:300px;background:#a78bfa;top:-50px;left:-50px}
.orb2{width:250px;height:250px;background:#60a5fa;bottom:-30px;right:-30px;animation-delay:-6s}
.orb3{width:200px;height:200px;background:#f9a8d4;top:40%;left:50%;animation-delay:-12s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-30px) scale(1.1)}66%{transform:translate(-30px,50px) scale(0.95)}}

.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:40px 20px 60px}
.glass-card{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-br);border-radius:24px;box-shadow:0 10px 40px rgba(31,38,135,0.08);overflow:hidden}

/* 默认联系方式卡片样式 */
.default-content{padding:48px 36px 36px;text-align:center}
.close-btn{position:fixed;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-br);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.close-btn:hover{transform:rotate(90deg) scale(1.1);background:rgba(124,58,237,0.1)}
.avatar-wrap{width:110px;height:110px;border-radius:50%;margin:0 auto 20px;overflow:hidden;border:3px solid rgba(124,58,237,0.4);box-shadow:0 8px 32px rgba(124,58,237,0.2);animation:popIn 0.6s cubic-bezier(0.34,1.56,0.64,1)}
.avatar-wrap img{width:100%;height:100%;object-fit:cover}
@keyframes popIn{from{opacity:0;transform:translateY(40px) scale(0.5)}to{opacity:1;transform:translateY(0) scale(1)}}
.page-title{font-size:24px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.page-subtitle{font-size:14px;color:var(--text-dim);margin-bottom:28px}
.contact-list{text-align:left}
.contact-item{display:flex;align-items:center;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,0.5);margin-bottom:12px;border:1px solid rgba(255,255,255,0.6);transition:all 0.3s;opacity:0;animation:slideIn 0.4s ease forwards}
.contact-item:hover{background:rgba(255,255,255,0.7);transform:translateY(-2px);box-shadow:0 4px 20px rgba(124,58,237,0.08)}
.contact-item:nth-child(1){animation-delay:0.1s}
.contact-item:nth-child(2){animation-delay:0.2s}
.contact-item:nth-child(3){animation-delay:0.3s}
.contact-item:nth-child(4){animation-delay:0.4s}
.contact-item:nth-child(5){animation-delay:0.5s}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.contact-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-right:14px;flex-shrink:0;font-size:22px;color:#fff}
.contact-icon.wechat{background:linear-gradient(135deg,#07c160,#00a854)}
.contact-icon.qq{background:linear-gradient(135deg,#12b7f5,#0099cc)}
.contact-icon.email{background:linear-gradient(135deg,#ea4335,#fbbc05)}
.contact-icon.telegram{background:linear-gradient(135deg,#0088cc,#005580)}
.contact-icon.github{background:linear-gradient(135deg,#333,#000)}
.contact-info{flex:1;min-width:0}
.contact-label{font-size:12px;color:var(--text-dim);margin-bottom:2px}
.contact-value{font-size:15px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;flex-shrink:0;margin-left:10px}
.copy-btn:hover{opacity:0.9;transform:scale(1.05)}
.copy-btn:active{transform:scale(0.95)}
.credit-section{margin-top:24px;padding-top:16px;border-top:1px solid rgba(128,128,128,0.1);text-align:left}
.credit-title{font-size:13px;font-weight:700;margin-bottom:10px;opacity:0.8}
.credit-row{display:flex;flex-wrap:wrap;gap:8px}
.credit-item{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.6);font-size:12px}
.credit-name{font-weight:600;margin-right:4px;color:var(--accent)}
.credit-role{color:var(--text-dim)}
.loading{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:14px}
.loading .spinner{width:36px;height:36px;border:3px solid rgba(124,58,237,0.15);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 自定义HTML区域 */
.custom-content{padding:0}
.custom-content>*:first-child{border-radius:24px 24px 0 0}
</style>
</head>
<body>
<div class="bg-orbs">
	<div class="orb orb1"></div>
	<div class="orb orb2"></div>
	<div class="orb orb3"></div>
</div>

<button class="close-btn" onclick="history.back()" title="返回">←</button>

<div class="page">
	<div id="page-content">
		<div class="loading">
			<div class="spinner"></div>
			加载中...
		</div>
	</div>
</div>

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function copyText(text){
	var ta=document.createElement('textarea');
	ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
	document.body.appendChild(ta);ta.select();
	try{document.execCommand('copy')}catch(e){}
	document.body.removeChild(ta);
	var old=event&&event.target?event.target.textContent:'';
	if(event&&event.target){event.target.textContent='已复制';setTimeout(function(){event.target.textContent=old},1500)}
}

function renderDefault(profile){
	var c=profile.contact||{};
	var items=[];
	if(c.wechat) items.push({icon:'wechat',emoji:'💬',label:'微信',value:c.wechat});
	if(c.qq) items.push({icon:'qq',emoji:'🐧',label:'QQ',value:c.qq});
	if(c.email) items.push({icon:'email',emoji:'📧',label:'邮箱',value:c.email});
	if(c.telegram) items.push({icon:'telegram',emoji:'✈️',label:'Telegram',value:c.telegram});

	var html='<div class="glass-card"><div class="default-content">'+
		'<div class="avatar-wrap"><img src="'+escHtml(profile.avatar||'./static/img/logo.png')+'" onerror="this.src=\'./static/img/i1.png\'"></div>'+
		'<div class="page-title">联系作者</div>'+
		'<div class="page-subtitle">获取联系方式</div>';

	if(items.length>0){
		html+='<div class="contact-list">';
		items.forEach(function(it){
			html+='<div class="contact-item">'+
				'<div class="contact-icon '+it.icon+'">'+it.emoji+'</div>'+
				'<div class="contact-info"><div class="contact-label">'+it.label+'</div><div class="contact-value">'+escHtml(it.value)+'</div></div>'+
				'<button class="copy-btn" onclick="copyText(\''+escHtml(it.value).replace(/'/g,"\\'")+'\')">复制</button></div>';
		});
		html+='</div>';
	}

	html+='<div class="credit-section">'+
		'<div class="credit-title">💫 致敬</div>'+
		'<div class="credit-row">'+
		'<div class="credit-item"><span class="credit-name">@By-zmy</span><span class="credit-role">(作者)</span></div>'+
		'<div class="credit-item"><span class="credit-name">@By-TRAE</span><span class="credit-role">(AI)</span></div>'+
		'<div class="credit-item"><span class="credit-name">@By-Gemini</span><span class="credit-role">(AI)</span></div>'+
		'<div class="credit-item"><span class="credit-name">@By-GPT</span><span class="credit-role">(AI)</span></div>'+
		'</div></div>';

	html+='</div></div>';
	return html;
}

async function loadPage(){
	var container=document.getElementById('page-content');
	try{
		// 1. 先取状态：判断是文件上传 / legacy modal_html / 还是默认
		var r0=await fetch('./api/profile.php?action=get_contact_html');
		var d0=await r0.json();
		var hasFile=(d0 && d0.success && d0.exists && d0.size>0);
		var isLegacy=(d0 && d0.success && d0.legacy && !hasFile);

		if(hasFile){
			// 有上传文件：直接 iframe 原样嵌入，100% 保留样式/脚本/布局
			container.innerHTML='';
			var iframe=document.createElement('iframe');
			iframe.src='./uploads/contact_custom.html?t='+Date.now();
			iframe.style.cssText='width:100%;min-height:80vh;border:none;border-radius:24px;background:transparent;display:block';
			iframe.setAttribute('allow','clipboard-write');
			// 自适应高度（同域）
			iframe.onload=function(){
				try{
					var doc=iframe.contentDocument||iframe.contentWindow.document;
					var h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight,600);
					iframe.style.height=h+'px';
				}catch(e){
					iframe.style.height='90vh';
				}
			};
			container.appendChild(iframe);
			return;
		}

		if(isLegacy){
			// 只有旧版modal_html：注入到卡片容器中（兼容旧数据）
			var r1=await fetch('./api/profile.php?action=get_contact_html_content');
			var d1=await r1.json();
			if(d1 && d1.success && d1.has_custom && d1.html){
				container.innerHTML='<div class="glass-card custom-content">'+d1.html+'</div>';
				return;
			}
		}

		// 无自定义：加载默认联系方式卡片
		var r=await fetch('./api/profile.php?action=get');
		var data=await r.json();
		var profile=(data&&data.profile)?data.profile:{};
		container.innerHTML=renderDefault(profile);
	}catch(e){
		container.innerHTML='<div class="glass-card"><div class="default-content"><div class="page-title">加载失败</div><div class="page-subtitle">请刷新重试</div></div></div>';
	}
}
loadPage();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>404 - 页面走丢了</title>
	<link rel="icon" href="./static/img/favicon.ico">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="stylesheet" href="./static/css/style.css">
	<link rel="stylesheet" href="./static/css/root.css">
	<style>
		.error-page{max-width:720px;margin:0 auto;padding:30px 20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
		.error-code{font-size:180px;font-weight:900;font-family:"title";line-height:1;background:linear-gradient(135deg,var(--purple_text_color),#ff9b6b,var(--purple_text_color));background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradientMove 4s ease-in-out infinite;user-select:none}
		@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
		.error-title{font-size:28px;font-weight:700;color:var(--main_text_color);margin-top:10px;margin-bottom:10px}
		.error-desc{font-size:15px;color:var(--item_left_text_color);margin-bottom:30px;line-height:1.7}
		.error-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
		.error-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;transition:all 0.3s;border:none}
		.error-btn.primary{background:var(--text_bg_color);color:var(--main_text_color)}
		.error-btn.primary:hover{opacity:0.85;transform:translateY(-2px)}
		.error-btn.secondary{background:var(--item_bg_color);backdrop-filter:blur(var(--card_filter));-webkit-backdrop-filter:blur(var(--card_filter));color:var(--main_text_color)}
		.error-btn.secondary:hover{background:var(--item_hover_color);transform:translateY(-2px)}
		.error-btn svg{width:18px;height:18px}
		.error-search{width:100%;max-width:480px;margin-bottom:40px}
		.error-search-title{font-size:15px;color:var(--item_left_text_color);margin-bottom:12px}
		.error-search-form{display:flex;gap:10px}
		.error-search-form input{flex:1;padding:12px 16px;border:1px solid rgba(128,128,128,0.2);border-radius:12px;background:rgba(255,255,255,0.06);color:var(--main_text_color);font-size:14px;outline:none;transition:border-color 0.3s;box-sizing:border-box}
		.error-search-form input:focus{border-color:var(--purple_text_color)}
		.error-search-form button{padding:12px 20px;border:none;border-radius:12px;background:var(--text_bg_color);color:var(--main_text_color);font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s;white-space:nowrap}
		.error-search-form button:hover{opacity:0.85}
		.error-links{width:100%;max-width:560px}
		.error-links-title{font-size:15px;color:var(--item_left_text_color);margin-bottom:16px;text-align:center}
		.error-links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
		.error-link-item{padding:16px 10px;border-radius:12px;background:var(--item_bg_color);backdrop-filter:blur(var(--card_filter));-webkit-backdrop-filter:blur(var(--card_filter));color:var(--main_text_color);font-size:13px;text-decoration:none;transition:all 0.3s;display:flex;flex-direction:column;align-items:center;gap:6px}
		.error-link-item:hover{background:var(--item_hover_color);transform:translateY(-3px)}
		.error-link-item .icon{font-size:24px}
		.error-float{position:fixed;font-size:40px;opacity:0.15;pointer-events:none;animation:floatAround 20s linear infinite;user-select:none}
		.error-float.f1{top:10%;left:5%;animation-delay:0s}
		.error-float.f2{top:20%;right:8%;animation-delay:-5s;font-size:50px}
		.error-float.f3{bottom:15%;left:10%;animation-delay:-10s;font-size:35px}
		.error-float.f4{bottom:20%;right:5%;animation-delay:-15s;font-size:45px}
		@keyframes floatAround{
			0%{transform:translate(0,0) rotate(0deg)}
			25%{transform:translate(20px,-20px) rotate(10deg)}
			50%{transform:translate(0,-40px) rotate(0deg)}
			75%{transform:translate(-20px,-20px) rotate(-10deg)}
			100%{transform:translate(0,0) rotate(0deg)}
		}
		@media (max-width:768px){
			.error-code{font-size:120px}
			.error-title{font-size:22px}
			.error-desc{font-size:14px}
			.error-links-grid{grid-template-columns:repeat(3,1fr)}
			.error-search-form{flex-direction:column}
			.error-search-form button{width:100%}
		}
	</style>
</head>
<body>
	<div class="error-float f1">🔮</div>
	<div class="error-float f2">✨</div>
	<div class="error-float f3">🌟</div>
	<div class="error-float f4">💫</div>

	<div class="error-page">
		<div class="error-code">404</div>
		<div class="error-title">页面走丢了</div>
		<div class="error-desc">
			抱歉，您访问的页面不存在<br>
			可能链接已失效，或者页面被搬到了别的地方
		</div>

		<div class="error-actions">
			<a class="error-btn primary" href="./index.html">
				<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M512 128 128 480v416h224V640h320v256h224V480z" fill="currentColor"/></svg>
				返回首页
			</a>
			<button class="error-btn secondary" onclick="goBack()">
				<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M672 192 320 544l352 352" fill="none" stroke="currentColor" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/></svg>
				返回上页
			</button>
		</div>

		<div class="error-search">
			<div class="error-search-title">🔍 试试搜索你想找的内容</div>
			<form class="error-search-form" onsubmit="return doSearch(event)">
				<input id="q" type="text" placeholder="输入关键词搜索..." autofocus>
				<button type="submit">搜索</button>
			</form>
		</div>

		<div class="error-links">
			<div class="error-links-title">🏠 快速导航</div>
			<div class="error-links-grid">
				<a class="error-link-item" href="./index.html">
					<span class="icon">🏠</span>
					<span>首页</span>
				</a>
				<a class="error-link-item" href="./tools.html">
					<span class="icon">🛠️</span>
					<span>在线工具</span>
				</a>
				<a class="error-link-item" href="./message.html">
					<span class="icon">💬</span>
					<span>留言板</span>
				</a>
				<a class="error-link-item" href="./photos.html">
					<span class="icon">🖼️</span>
					<span>照片墙</span>
				</a>
				<a class="error-link-item" href="./shop.html">
					<span class="icon">🔍</span>
					<span>问题搜索</span>
				</a>
				<a class="error-link-item" href="./login.html">
					<span class="icon">🔐</span>
					<span>管理员</span>
				</a>
				<a class="error-link-item" href="https://www.baidu.com" target="_blank">
					<span class="icon">🌐</span>
					<span>百度</span>
				</a>
				<a class="error-link-item" href="https://www.bilibili.com" target="_blank">
					<span class="icon">📺</span>
					<span>哔哩哔哩</span>
				</a>
			</div>
		</div>
	</div>

	<script>
		function goBack(){
			if(window.history.length>1){window.history.back()}
			else{window.location.href='./index.html'}
		}
		function doSearch(e){
			e.preventDefault();
			var q=document.getElementById('q').value.trim();
			if(q){window.location.href='https://www.baidu.com/s?wd='+encodeURIComponent(q)}
			else{document.getElementById('q').focus()}
			return false
		}

		(function() {
			const audio = document.createElement('audio');
			audio.src = './背景乐.mp3';
			audio.loop = true;
			audio.volume = 0.5;
			audio.preload = 'auto';
			document.body.appendChild(audio);

			const player = document.createElement('div');
			player.style.cssText = 'position:fixed;bottom:80px;right:30px;z-index:9999;';
			player.innerHTML = `
				<div style="width:50px;height:50px;border-radius:50%;background:var(--item_bg_color);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(128,128,128,0.2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--main_text_color);transition:all 0.3s;"
					 onmouseover="this.style.transform='scale(1.1)'"
					 onmouseout="this.style.transform='scale(1)'">
					<svg viewBox="0 0 1024 1024" style="width:24px;height:24px;fill:currentColor;display:none" class="m-play"><path d="M572.9 243.2c-7.1-1.4-14.2-2-21.3-2-60.2 0-109.3 49.1-109.3 109.3v250.2c-12.8-7.6-27.1-12.1-42.7-12.1-60.2 0-109.3 49.1-109.3 109.3s49.1 109.3 109.3 109.3 109.3-49.1 109.3-109.3V372.1c0-36.2 29.3-65.5 65.5-65.5 7.1 0 14.2 1.1 21.3 3.2V243.2z"></path></svg>
					<svg viewBox="0 0 1024 1024" style="width:24px;height:24px;fill:currentColor" class="m-pause"><path d="M349.749455 728.497863a51.2 51.2 0 0 1-51.2 51.2l0 0a51.2 51.2 0 0 1-51.2-51.2V295.683772a51.2 51.2 0 0 1 51.2-51.2l0 0a51.2 51.2 0 0 1 51.2 51.2V728.497863zM776.718909 728.497863a51.2 51.2 0 0 1-51.2 51.2l0 0a51.2 51.2 0 0 1-51.2-51.2V295.683772a51.2 51.2 0 0 1 51.2-51.2l0 0a51.2 51.2 0 0 1 51.2 51.2V728.497863z"></path></svg>
				</div>`;
			document.body.appendChild(player);

			const playIcon = player.querySelector('.m-play');
			const pauseIcon = player.querySelector('.m-pause');
			let playing = false;

			function toggle() {
				if (playing) {
					audio.pause();
					playing = false;
					playIcon.style.display = 'none';
					pauseIcon.style.display = 'block';
					localStorage.setItem('musicPlaying', 'false');
				} else {
					audio.play().then(() => {
						playing = true;
						playIcon.style.display = 'block';
						pauseIcon.style.display = 'none';
						localStorage.setItem('musicPlaying', 'true');
					}).catch(() => {});
				}
			}
			player.querySelector('div').addEventListener('click', toggle);

			function tryPlay() {
				if (localStorage.getItem('musicPlaying') === 'false') return;
				audio.play().then(() => {
					playing = true;
					playIcon.style.display = 'block';
					pauseIcon.style.display = 'none';
				}).catch(() => {
					const firstInteract = () => {
						if (localStorage.getItem('musicPlaying') !== 'false') {
							audio.play().then(() => {
								playing = true;
								playIcon.style.display = 'block';
								pauseIcon.style.display = 'none';
							}).catch(() => {});
						}
						document.removeEventListener('click', firstInteract);
						document.removeEventListener('touchstart', firstInteract);
					};
					document.addEventListener('click', firstInteract, { once: true });
					document.addEventListener('touchstart', firstInteract, { once: true });
				});
			}
			tryPlay();

			try { fetch('/api/visitor.php?path=' + encodeURIComponent(location.pathname)); } catch(e) {}
		})();
	</script>
	<style>
		@media (max-width: 768px) {
			body > div[style*="bottom:80px"] { bottom: 60px !important; right: 20px !important; }
			body > div[style*="bottom:80px"] > div { width: 40px !important; height: 40px !important; }
			body > div[style*="bottom:80px"] svg { width: 20px !important; height: 20px !important; }
		}
	</style>
</body>
</html>
